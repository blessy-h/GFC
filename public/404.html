<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon for Google Search & Browsers -->
  <link rel="icon" type="image/png" href="gfc-logo.png">
  <link rel="shortcut icon" type="image/png" href="gfc-logo.png">
  <link rel="apple-touch-icon" href="gfc-logo.png">
  <title>Page Not Found | GFC Restaurant Kanyakumari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    // GitHub Pages Smart SPA / Route Redirector
    (function () {
      var path = window.location.pathname;
      var base = '';
      if (!path.startsWith(base)) {
        base = '';
      }
      var clean = path.replace(/^\/GFC/, '');

      var knownDirs = [
        'about', 'menu', 'gallery', 'contact', 'reservation'
      ];

      function redirectTo(target) {
        if (path !== target && path !== target + 'index.html') {
          window.location.replace(target);
        }
      }

      for (var i = 0; i < knownDirs.length; i++) {
        var d = knownDirs[i];
        if (clean === '/' + d || clean === '/' + d + '.html') {
          redirectTo(base + '/' + d + '/');
          return;
        }
      }
    })();
  </script>
  <style>
    :root {
      --orange: #e85d04;
      --dark-orange: #c94700;
      --dark: #171717;
      --cream: #fffaf4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      color: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 600px;
      background: white;
      padding: 50px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(232, 93, 4, 0.1);
      color: var(--orange);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.1;
      margin-bottom: 16px;
      color: var(--dark);
    }
    h1 span { color: var(--orange); }
    p {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: .3s;
    }
    .btn-primary { background: var(--orange); color: white; }
    .btn-primary:hover { background: var(--dark-orange); transform: translateY(-2px); }
    .btn-outline { border: 2px solid var(--orange); color: var(--orange); }
    .btn-outline:hover { background: var(--orange); color: white; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">GFC RESTAURANT</span>
    <h1>Page Not <span>Found</span></h1>
    <p>The page you are looking for may have moved or is being updated. Let's get you back to the delicious food!</p>
    <div class="btns">
      <a href="./" class="btn btn-primary">Return Home</a>
      <a href="menu/" class="btn btn-outline">Explore Menu</a>
      <a href="reservation/" class="btn btn-outline">Book a Table</a>
    </div>
  </div>
</body>
</html>
